name: Repository artifact boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reject tracked generated artifacts
        run: npm run verify:repo-artifacts

      - name: Install dependencies
        run: npm ci

      - name: Test repository artifact contracts
        run: npm test -- --run tests/unit/repo-docs-contract.test.js scripts/verify-repository-artifacts.test.js
