<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fractured Order plenary dashboard for SME-finalized PLI outputs.">
    <title>Fractured Order | Plenary Board</title>
    <link rel="icon" type="image/x-icon" href="./src/img/FO_icon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">

    <link rel="stylesheet" href="./styles/base/reset.css">
    <link rel="stylesheet" href="./styles/base/variables.css">
    <link rel="stylesheet" href="./styles/base/typography.css">
    <link rel="stylesheet" href="./styles/components/buttons.css">
    <link rel="stylesheet" href="./styles/components/forms.css">
    <link rel="stylesheet" href="./styles/components/badges.css">
    <link rel="stylesheet" href="./styles/layouts/header.css">
    <link rel="stylesheet" href="./styles/components/plenary.css">
</head>

<body class="plenary-page" data-team="whitecell">
    <a href="#plenaryBoard" class="skip-link">Skip to plenary board</a>
    <div id="runtimeConfigNotice" hidden aria-live="assertive"></div>

    <div class="plenary-shell">
        <header class="plenary-header">
            <div class="plenary-brand">
                <span class="plenary-brand-mark" aria-hidden="true">FO</span>
                <div class="plenary-brand-copy">
                    <p class="plenary-brand-name">Fractured Order</p>
                    <p class="plenary-brand-kind">Plenary board</p>
                </div>
            </div>

            <div class="plenary-session">
                <span id="sessionName">No session</span>
                <span class="plenary-session-sep" aria-hidden="true">·</span>
                <span class="header-game-state">
                    <span class="game-state-item">
                        <span class="game-state-label">Move</span>
                        <span id="headerMove" class="game-state-value">—</span>
                    </span>
                    <span class="game-state-item">
                        <span class="game-state-label">Phase</span>
                        <span id="headerPhase" class="game-state-value">—</span>
                    </span>
                </span>
                <span class="plenary-meta" id="plenaryMeta"></span>
            </div>

            <div class="plenary-controls">
                <label class="plenary-scope">
                    <span class="plenary-scope-label">Scope</span>
                    <select id="plenaryScope" class="form-input form-select" aria-label="Report scope">
                        <option value="simulation">Whole simulation</option>
                    </select>
                </label>
                <time id="plenaryClock" class="plenary-clock" datetime=""></time>
                <div class="header-actions">
                    <button type="button" class="btn btn-ghost btn-sm" id="pageRefreshBtn" data-page-refresh aria-label="Refresh page">Refresh</button>
                    <button type="button" class="btn btn-secondary btn-sm" id="plenaryFullscreenBtn" aria-label="Enter fullscreen">Full screen</button>
                </div>
            </div>
        </header>

        <div id="plenaryBoard" class="plenary-board" tabindex="-1"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/roles/plenary.js"></script>
</body>
</html>
