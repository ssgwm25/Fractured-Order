<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fractured Order SME console for PLI review and external handoffs.">
    <title>Fractured Order | SME Console</title>
    <link rel="icon" type="image/x-icon" href="./src/img/FO_icon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">

    <link rel="stylesheet" href="./styles/base/reset.css">
    <link rel="stylesheet" href="./styles/base/variables.css">
    <link rel="stylesheet" href="./styles/base/typography.css">
    <link rel="stylesheet" href="./styles/components/buttons.css">
    <link rel="stylesheet" href="./styles/components/forms.css">
    <link rel="stylesheet" href="./styles/components/cards.css">
    <link rel="stylesheet" href="./styles/components/modals.css">
    <link rel="stylesheet" href="./styles/components/badges.css">
    <link rel="stylesheet" href="./styles/layouts/app-layout.css">
    <link rel="stylesheet" href="./styles/layouts/header.css">
    <link rel="stylesheet" href="./styles/layouts/sidebar.css">
    <link rel="stylesheet" href="./styles/layouts/grid.css">
    <link rel="stylesheet" href="./styles/components/pli-sme.css">
</head>

<body data-team="sme">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="runtimeConfigNotice" hidden aria-live="assertive"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span>SME Console</span>
            </div>
            <nav class="sidebar-nav">
                <ul class="sidebar-menu">
                    <li class="sidebar-menu-item">
                        <a href="#smeQueue" class="sidebar-link active" data-section="smeQueue">
                            <span class="sidebar-icon">
                                <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false">
                                    <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zm6-4a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zm6-3a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
                                </svg>
                            </span>
                            <span class="sidebar-label" id="smeQueueNavLabel">Queue</span>
                            <span class="sidebar-badge" id="smeQueueBadge" hidden>0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="page-header">
                <div class="header-left">
                    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" focusable="false" width="20" height="20">
                            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <div class="header-title-group">
                        <h1 class="header-title" id="headerTitle">SME Console</h1>
                        <p class="header-subtitle" id="headerSubtitle">Subject-matter expert review</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-session" id="headerSessionMeta"></div>
                </div>
            </header>

            <main class="main-content" id="main-content">
                <section id="smeQueueSection" class="content-section">
                    <div class="section-header">
                        <div class="section-title-wrapper">
                            <h2 class="section-title" id="smeQueueSectionTitle">SME Queue</h2>
                            <p class="section-description" id="smeQueueSectionDescription">Role-scoped review and handoff work</p>
                        </div>
                    </div>
                    <div class="section-body">
                        <div id="smeQueuePanel"></div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/roles/sme.js"></script>
</body>
</html>
